[project]
name = "proxy-reencryption-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "py-ecc>=7.0.1",
    "httpx>=0.27.0",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
